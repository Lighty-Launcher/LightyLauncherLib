[package]
name = "lighty-launch"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
description = "Minecraft launch logic for Lighty Launcher"

[dependencies]
# Workspace crates
lighty-core = { workspace = true }
lighty-java = { workspace = true }
lighty-version = { workspace = true }
lighty-loaders = { workspace = true }
# Always-on so `WithMods` (the trait the launch pipeline bounds against)
# and `ModRequest` are available regardless of mod feature flags. Source-
# specific code paths (Modrinth / CurseForge) are gated below; modpack
# support rides on whichever provider feature is active.
lighty-modsloader = { workspace = true }
lighty-auth = { workspace = true }
lighty-event = { workspace = true, optional = true }

# Async Runtime
tokio.workspace = true

# HTTP Client
reqwest.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async Utilities
async-trait.workspace = true
futures.workspace = true
futures-util.workspace = true
tokio-util.workspace = true

# Error Handling
thiserror.workspace = true

# Logging
tracing = { workspace = true, optional = true }

# Filesystem & Compression
async_zip.workspace = true
# Sync ZIP reads for the install-processor pipeline (reading
# install_profile.json/version.json out of the installer JAR, extracting
# /maven/... bundled artifacts).
zip.workspace = true

# Cryptography
sha1.workspace = true
hex.workspace = true

# Paths & Filenames
sanitize-filename.workspace = true

# Utilities
once_cell.workspace = true
fastrand.workspace = true

# Windows API (conditional)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# Unix API (conditional)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }

# X11 API (conditional)
# Matches a game window to its PID through `_NET_CLIENT_LIST` /
# `_NET_WM_PID`, the X11 counterpart of `EnumWindows`. Default features
# are empty: pure Rust, no libxcb FFI, no unsafe.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", optional = true }

[features]
default = []
events = ["lighty-event", "lighty-java/events", "lighty-core/events", "lighty-modsloader/events", "dep:x11rb"]
# Required so the installer can run NeoForge post-install processors
neoforge = ["lighty-loaders/neoforge"]
# Required so the installer can run Forge post-install processors
forge = ["lighty-loaders/forge"]
# Wire up the launch-side mod resolver (which spawns no JVM but reads
# modsloader's mods clients). Each provider feature also pulls in its
# modpack-format support (`.mrpack` for Modrinth, `.zip` for CurseForge).
modrinth = ["lighty-modsloader/modrinth"]
curseforge = ["lighty-modsloader/curseforge"]
# Forwarded from the root so the launch site can read tokens from the
# OS keychain when the caller opted-in via `MicrosoftAuth::with_keyring`.
keyring = ["lighty-auth/keyring"]
