[package]
name = "lighty-auth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
description = "Authentication modules for Lighty Launcher"

[dependencies]
# Workspace crates
lighty-core = { workspace = true }
lighty-event = { workspace = true, optional = true }

# Async Runtime
tokio.workspace = true

# HTTP Client
reqwest.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Secrets (token wrapping — disables accidental Debug/Serialize leaks)
secrecy.workspace = true

# OS keychain (opt-in via `keyring` feature). Pulls D-Bus on Linux, so
# this stays optional for headless / CI environments.
keyring = { workspace = true, optional = true }

# JWT decoding (Microsoft access_token carries the Xbox xuid claim)
base64.workspace = true

# Error Handling
thiserror.workspace = true

# Logging
tracing = { workspace = true, optional = true }

[features]
events = ["lighty-event"]
tracing = ["dep:tracing"]
keyring = ["dep:keyring"]
